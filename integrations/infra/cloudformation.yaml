AWSTemplateFormatVersion: '2010-09-09'
Description: Minimal AWS data plane for the Oryxa integrations service

Parameters:
  PieceRunnerImageUri:
    Type: String
    Description: Immutable ECR image URI including its sha256 digest
  EventBusName:
    Type: String
    Default: default

Resources:
  IntegrationsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Envelope data keys for Oryxa integration credentials
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action: 'kms:*'
            Resource: '*'
  IntegrationsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/oryxa-integrations
      TargetKeyId: !Ref IntegrationsKey

  IntegrationsState:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: oryxa-integrations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }
      TimeToLiveSpecification: { AttributeName: expires_at, Enabled: true }

  WebhookDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: oryxa-integrations-webhooks-dlq
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: 1209600
  WebhookQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: oryxa-integrations-webhooks
      KmsMasterKeyId: alias/aws/sqs
      VisibilityTimeout: 120
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt WebhookDeadLetterQueue.Arn
        maxReceiveCount: 5

  PieceRunnerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*'
  PieceRunner:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: oryxa-integrations-piece-runner
      PackageType: Image
      Code: { ImageUri: !Ref PieceRunnerImageUri }
      Architectures: [arm64]
      MemorySize: 1024
      Timeout: 60
      ReservedConcurrentExecutions: 20
      Role: !GetAtt PieceRunnerRole.Arn

  BrokerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Least-privilege data-plane policy for the integrations API and dispatcher
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: IntegrationsState
            Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem]
            Resource: !GetAtt IntegrationsState.Arn
          - Sid: CredentialDataKeys
            Effect: Allow
            Action: [kms:GenerateDataKey, kms:Decrypt]
            Resource: !GetAtt IntegrationsKey.Arn
            Condition:
              StringEquals:
                'kms:EncryptionContext:service': oryxa-integrations
          - Sid: WebhookQueue
            Effect: Allow
            Action: [sqs:SendMessage, sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
            Resource: !GetAtt WebhookQueue.Arn
          - Sid: AuthEventsQueue
            Effect: Allow
            Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
            Resource: !Sub 'arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:integrations-events'
          - Sid: InvokeRunner
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt PieceRunner.Arn
          - Sid: PublishDomainEvents
            Effect: Allow
            Action: events:PutEvents
            Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/${EventBusName}'

Outputs:
  DynamoTableName: { Value: !Ref IntegrationsState }
  WebhookQueueUrl: { Value: !Ref WebhookQueue }
  WebhookDeadLetterQueueUrl: { Value: !Ref WebhookDeadLetterQueue }
  KmsKeyArn: { Value: !GetAtt IntegrationsKey.Arn }
  PieceRunnerFunctionName: { Value: !Ref PieceRunner }
  BrokerPolicyArn: { Value: !Ref BrokerPolicy }
