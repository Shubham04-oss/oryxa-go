services:
  files:
    build:
      context: .
      dockerfile: files/Dockerfile
    image: oryxa-files:dev
    restart: unless-stopped
    env_file:
      - files/.env
    environment:
      FILES_ADDRESS: ":8080"
      AUTH_URL: http://auth:8080
      TEAMS_URL: http://teams:8080
      DATABASE_URL: postgres://oryxa:oryxa-dev-password@oryxa-go-postgres-1:5432/oryxa?sslmode=disable
      AWS_ENDPOINT_URL: http://oryxa-go-eventbridge-1:4566
      FILES_BUCKET_NAME: oryxa-files
    ports:
      - "${FILES_PORT:-8085}:8080"
    networks:
      - oryxa-go

networks:
  oryxa-go:
    external: true
    name: oryxa-go_default
