services:
  rag:
    build:
      context: .
      dockerfile: rag/Dockerfile
    image: oryxa-rag:dev
    restart: unless-stopped
    env_file:
      - rag/.env
    environment:
      RAG_ADDRESS: ":8080"
      AUTH_URL: http://auth:8080
      TEAMS_URL: http://teams:8080
      FILES_URL: http://files:8080
      DATABASE_URL: postgres://oryxa:oryxa-dev-password@oryxa-go-postgres-1:5432/oryxa?sslmode=disable
      AWS_ENDPOINT_URL: http://oryxa-go-eventbridge-1:4566
    ports:
      - "${RAG_PORT:-8086}:8080"
    networks:
      - oryxa-go

networks:
  oryxa-go:
    external: true
    name: oryxa-go_default
