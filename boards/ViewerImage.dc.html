<body>
<x-dc>

<div class="{{themeClass}}" style="background: var(--base)">
<div class="nx-app" style="font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif">
  <dc-import name="Rail" active="knowledge" live="{{yes}}" hint-size="60px,100%"></dc-import>

  <main class="nx-main" aria-label="Launch banner v3.png">
    <header class="nx-head">
      <div class="nx-crumbs"><span>Knowledge</span><span class="nx-sep">/</span><span>Product docs</span><span class="nx-sep">/</span><strong>Launch banner v3.png</strong></div>
      <div class="nx-head-actions"></div>
    </header>
    <div class="vw-wrap">
      <section class="vw ws-tile is-focused" aria-label="Launch banner v3.png">
        <div class="vw-bar">
          <span class="vw-kind is-img" aria-hidden="true">IMG</span>
          <div class="vw-name"><strong>Launch banner v3.png</strong><small>Uploaded by Raya · 1200 × 628 · 2 notes</small></div>
          <div class="vw-tools"><button type="button">Fit</button><button type="button" aria-label="Zoom out"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button><span class="vw-num">64%</span><button type="button" aria-label="Zoom in"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button><button type="button">Compare</button></div>
          <div class="vw-acts">
            <button class="rs-btn" type="button" style="height: 30px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 10 3-3 3 3"/><path d="M12 13V7"/><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M12 17v4"/><path d="M8 21h8"/></svg>Show in parley</button>

            <button class="hd-btn is-quiet" type="button" aria-label="More"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
          </div>
        </div>
        <div class="vw-body">
          <div class="vw-imgwrap">
            <div class="vw-img" role="img" aria-label="Launch banner: Now in Europe">
              <span class="i-logo">oryxa</span><span class="i-orb"></span>
              <span class="i-head">Now in Europe.</span>
              <span class="i-sub">Live in five countries from 28 October</span>
              <span class="vw-mark" style="left: 48%; top: 85%">1</span>
              <span class="vw-mark" style="left: 2%; top: 3%; background: #26402f; color: #b9e6c6">2</span>
            </div>
            <div class="vw-pin" style="left: 24px; bottom: 24px"><img alt="" src="/_blob/f622cb1b08b3c2361d7aa6e797f0d2f3"><div><b>Raya · on the date</b>Should be 4 November now.</div></div>
          </div>
          <div class="vw-versions" aria-label="Versions"><b>Versions</b>
            <div class="vw-ver is-active"><i></i>v3 · Raya, 20 min ago</div>
            <div class="vw-ver"><i style="background: linear-gradient(135deg, #1b1f2a, #2b3550)"></i>v2 · yesterday</div>
            <div class="vw-ver"><i style="background: linear-gradient(135deg, #222, #3a3a3a)"></i>v1 · 10 Oct</div>
          </div>
        </div>
      </section>
    </div>

  </main>

  <dc-import name="AgentPanel" page="file" kind="image" hint-size="372px,100%"></dc-import>
</div>

<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, themeClass: (this.props.theme ?? 'dark') === 'light' ? 'light' : 'dark' };
  }
}
</script>
