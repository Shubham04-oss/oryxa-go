<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign up: check your inbox</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/f32f190865fef0a2e9f8e77cc5498886">
<link rel="stylesheet" href="/_blob/6f45e0000cdc5d3b68022ff8772ba543">
<link rel="stylesheet" href="/_blob/8fcfc97a611eed1a77ab799e995e95b4">
<link rel="stylesheet" href="/_blob/7743306d36203a29330ca2062623300f">
<link rel="stylesheet" href="/_blob/ec979927ac7a03464841432d3a3c8647">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700&amp;family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="{{themeClass}}">
<div class="sg">
  <div class="sg-side">
    <span class="sg-mark" aria-label="oryxa">oryxa<i>.</i></span>
    <div class="sg-form" role="status" aria-label="Check your inbox">
      <span class="sg-sent"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span>
      <h1>Check your inbox</h1>
      <p class="sg-sub">We sent a link to <span class="sg-mail">ada@northstar.io</span>. Open it on this device to finish signing up.</p>
      <div class="sg-row"><button class="sg-btn" type="button">Open Gmail</button><button class="sg-btn" type="button">Open Outlook</button></div>
      <p class="sg-alt">No email after a minute? <a href="#resend">Send it again</a> · <a href="#signup">Use another email</a></p>
    </div>
    <div class="sg-foot"><span class="sg-grow">© 2026 oryxa</span><a href="#privacy">Privacy</a><a href="#terms">Terms</a></div>
  </div>
  <div class="sg-scene" style="background-image: url('/_blob/fe7e75f9dac186b477afd076be0d686a')" role="img" aria-label="Painted scene">
    
    <div class="sg-line"><strong>Every ask is a message in a bottle.</strong><span>oryxa makes sure it reaches the right person.</span></div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, themeClass: (this.props.theme ?? 'dark') === 'light' ? 'light' : 'dark' };
  }
}
</script>
</body>
</html>
