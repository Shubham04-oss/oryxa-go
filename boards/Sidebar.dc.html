<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/f32f190865fef0a2e9f8e77cc5498886">
<link rel="stylesheet" href="/_blob/6f45e0000cdc5d3b68022ff8772ba543">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700&amp;family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav class="nx-side" aria-label="Workspace" style="font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; color: var(--text); background: var(--base); height: 100dvh">
  <button class="nx-org" type="button" aria-label="Switch workspace: Northstar">
    <span class="nx-org-mark" aria-hidden="true">N</span>
    <span class="nx-grow">Northstar</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <button class="nx-search" type="button" aria-label="Search or jump to, Command K">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
    <span class="nx-grow">Search or jump to</span>
    <span class="nx-kbd">⌘K</span>
  </button>

  <div class="nx-scroll">
    <div class="nx-section">
      <a class="nx-item {{a.today}}" href="#today"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg><span class="nx-grow">My workspace</span></a>
      <a class="nx-item {{a.requests}}" href="#requests"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg><span class="nx-grow">Requests</span><span class="nx-count is-strong" aria-label="3 waiting">3</span></a>
      <a class="nx-item {{a.chats}}" href="#chats"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"/></svg><span class="nx-grow">Chats with Krude</span></a>
    </div>

    <sc-if value="{{live}}" hint-placeholder-val="{{false}}">
      <section class="nx-live" aria-label="Live now">
        <div class="nx-live-row"><span class="nx-live-dot" aria-hidden="true"></span><span class="nx-grow">Parley · EU launch</span><span class="nx-live-sub">12:04</span></div>
        <div class="nx-live-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg><span class="nx-grow">Krude is browsing Notion</span></div>
        <div class="nx-live-actions">
          <button class="nx-icon-btn" type="button" aria-label="Mute"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19v3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><rect x="9" y="2" width="6" height="13" rx="3"/></svg></button>
          <button class="nx-icon-btn" type="button" aria-label="Turn camera on"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg></button>
          <button class="nx-icon-btn is-danger" type="button" aria-label="Leave parley"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.1 13.9a14 14 0 0 0 3.732 2.668 1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2 18 18 0 0 1-12.728-5.272"/><path d="M22 2 2 22"/><path d="M4.76 13.582A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 .244.473"/></svg></button>
        </div>
      </section>
    </sc-if>

    <div class="nx-section">
      <div class="nx-section-head"><span>Teamspaces</span><button type="button" aria-label="New teamspace"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></div>
      <a class="nx-item {{a.eu}}" href="#eu-launch"><svg class="nx-planet" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="32" fill="#3e2936"/><circle cx="32" cy="32" r="17" fill="#dc849d"/><circle cx="26" cy="26" r="7" fill="#ffb5b3" opacity=".7"/></svg><span class="nx-grow">EU launch</span><sc-if value="{{live}}" hint-placeholder-val="{{false}}"><span class="nx-live-dot" aria-label="Parley live"></span></sc-if><sc-if value="{{notLive}}" hint-placeholder-val="{{true}}"><span class="nx-dot" aria-label="Unread"></span></sc-if></a>
      <a class="nx-item {{a.sales}}" href="#sales"><svg class="nx-planet" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="32" fill="#23324b"/><circle cx="32" cy="32" r="17" fill="#849fe1"/><circle cx="26" cy="26" r="7" fill="#b7cbff" opacity=".7"/></svg><span class="nx-grow">Sales</span></a>
    </div>

    <div class="nx-section">
      <div class="nx-section-head"><span>Messages</span><button type="button" aria-label="New message"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg></button></div>
      <a class="nx-item {{a.priya}}" href="#priya"><img class="nx-av" alt="" src="/_blob/0177ed8ec461e9d6e02efb051320cb58"><span class="nx-grow">Priya Shah</span><span class="nx-count" aria-label="2 unread">2</span></a>
      <a class="nx-item {{a.rohan}}" href="#rohan"><img class="nx-av" alt="" src="/_blob/9e1491933c13feda7c1f7a1841e49db0"><span class="nx-grow">Rohan Mehta</span><span class="nx-count" aria-label="1 unread">1</span></a>
      <a class="nx-item {{a.raya}}" href="#raya"><img class="nx-av" alt="" src="/_blob/f622cb1b08b3c2361d7aa6e797f0d2f3"><span class="nx-grow">Raya Patel</span></a>
      <a class="nx-item {{a.people}}" href="#people"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 21a8 8 0 0 0-16 0"/><circle cx="10" cy="8" r="5"/><path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3"/></svg><span class="nx-grow">People</span><span class="nx-quiet">5</span></a>
    </div>

    <div class="nx-section">
      <div class="nx-section-head"><span>Agents</span><button type="button" aria-label="New specialist"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></div>
      <a class="nx-item {{a.krude}}" href="#krude"><img class="nx-av" alt="" src="/_blob/a83a89cb62825033a2c8663412697fe2"><span class="nx-grow">Krude</span><span class="nx-quiet">Your agent</span></a>
      <a class="nx-item {{a.specialists}}" href="#specialists"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg><span class="nx-grow">Specialists</span><span class="nx-quiet">3</span></a>
      <a class="nx-item {{a.teams}}" href="#agent-teams"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/></svg><span class="nx-grow">Agent teams</span><span class="nx-quiet">1</span></a>
      <a class="nx-item {{a.workflows}}" href="#workflows"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg><span class="nx-grow">Workflows</span><span class="nx-quiet">3</span></a>
    </div>

    <div class="nx-section">
      <div class="nx-section-head"><span>Library</span></div>
      <div class="nx-grid">
        <a class="nx-mini {{a.knowledge}}" href="#knowledge"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v16"/><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"/></svg><span>Knowledge</span></a>
        <a class="nx-mini {{a.files}}" href="#files"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg><span>Files</span></a>
        <a class="nx-mini {{a.tools}}" href="#tools"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.39 4.39a1 1 0 0 0 1.68-.474 2.5 2.5 0 1 1 3.014 3.015 1 1 0 0 0-.474 1.68l1.683 1.682a2.414 2.414 0 0 1 0 3.414L19.61 15.39a1 1 0 0 1-1.68-.474 2.5 2.5 0 1 0-3.014 3.015 1 1 0 0 1 .474 1.68l-1.683 1.682a2.414 2.414 0 0 1-3.414 0L8.61 19.61a1 1 0 0 0-1.68.474 2.5 2.5 0 1 1-3.014-3.015 1 1 0 0 0 .474-1.68l-1.683-1.682a2.414 2.414 0 0 1 0-3.414L4.39 8.61a1 1 0 0 1 1.68.474 2.5 2.5 0 1 0 3.014-3.015 1 1 0 0 1-.474-1.68l1.683-1.682a2.414 2.414 0 0 1 3.414 0z"/></svg><span>Tools</span></a>
      </div>
    </div>
  </div>

  <div class="nx-foot">
    <img alt="" src="/_blob/a14c0494a347b872dc9fa3ada6b82dd1">
    <span class="nx-grow"><strong>Ada Lovelace</strong><small>Admin</small></span>
    <button type="button" aria-label="Settings"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["today","requests","chats","eu","sales","priya","rohan","raya","people","krude","specialists","teams","workflows","knowledge","files","tools"],"default":"today"},"live":{"editor":"boolean","default":false},"$preview":{"width":264,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'today';
    const keys = ['today','requests','chats','eu','sales','priya','rohan','raya','people','krude','specialists','teams','workflows','knowledge','files','tools'];
    const a = {};
    keys.forEach((k) => { a[k] = k === active ? 'is-active' : ''; });
    const live = !!this.props.live;
    return { a, live, notLive: !live };
  }
}
</script>
</body>
</html>
