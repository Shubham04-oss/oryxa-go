<div class="{{themeClass}}">
<div class="sg">
  <div class="sg-side">
    <span class="sg-mark" aria-label="oryxa">oryxa<i>.</i></span>
    <div class="sg-form" role="status" aria-label="Email verified">
      <span class="sg-sent is-ok"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
      <h1>Email verified</h1>
      <p class="sg-sub">Your account is ready, and Krude is waiting for its first question.</p>
      <button class="sg-submit" type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px">Sign in <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
    </div>
    <div class="sg-foot"><span class="sg-grow">© 2026 oryxa</span><a href="#privacy">Privacy</a><a href="#terms">Terms</a></div>
  </div>
  <div class="sg-scene" style="background-image: url('/_blob/e488c320d85d63031817cefad7cde69d')" role="img" aria-label="Painted scene">
    
    <div class="sg-line"><strong>One crew. Every ask answered.</strong><span>Your team and its agents, in one place.</span></div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, themeClass: (this.props.theme ?? 'dark') === 'light' ? 'light' : 'dark' };
  }
}
</script>
