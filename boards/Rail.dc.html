<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["today","requests","chats","eu","sales","priya","rohan","krude","knowledge"],"default":"today"},"live":{"editor":"boolean","default":false},"$preview":{"width":60,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'today';
    const a = {};
    ['today','requests','chats','eu','sales','priya','rohan','krude','knowledge'].forEach((k) => { a[k] = k === active ? 'is-active' : ''; });
    return { a, live: !!this.props.live };
  }
}
</script>
