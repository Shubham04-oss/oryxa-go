<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Link not available</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/f32f190865fef0a2e9f8e77cc5498886">
<link rel="stylesheet" href="/_blob/6f45e0000cdc5d3b68022ff8772ba543">
<link rel="stylesheet" href="/_blob/8fcfc97a611eed1a77ab799e995e95b4">

<link rel="stylesheet" href="/_blob/ec979927ac7a03464841432d3a3c8647">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700&amp;family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="{{themeClass}}">
<div class="sg">
  <div class="sg-side">
    <span class="sg-mark" aria-label="oryxa">oryxa<i>.</i></span>
    <div class="sg-form" role="alert" aria-label="This link isn't available">
      <h1>This link isn't available</h1>
      <p class="sg-sub">Verification links expire after 24 hours, and each one works once.</p>
      <div class="sg-notice"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg><span>We can send a fresh link to <b style="color: var(--text)">ada@northstar.io</b>. It replaces the old one.</span></div>
      <button class="sg-submit" type="button">Send a new link</button>
      <p class="sg-alt"><a href="#signin">Back to sign in</a></p>
    </div>
    <div class="sg-foot"><span class="sg-grow">© 2026 oryxa</span><a href="#privacy">Privacy</a><a href="#terms">Terms</a></div>
  </div>
  <div class="sg-scene" style="background-image: url('/_blob/c31df55dc0359f3dff5dccf2c15109f3')" role="img" aria-label="Painted scene">
    
    <div class="sg-line"><strong>This one didn't get through.</strong><span>A new link takes a few seconds.</span></div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, themeClass: (this.props.theme ?? 'dark') === 'light' ? 'light' : 'dark' };
  }
}
</script>
</body>
</html>
