<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forgot password</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/f32f190865fef0a2e9f8e77cc5498886">
<link rel="stylesheet" href="/_blob/6f45e0000cdc5d3b68022ff8772ba543">
<link rel="stylesheet" href="/_blob/8fcfc97a611eed1a77ab799e995e95b4">
<link rel="stylesheet" href="/_blob/7743306d36203a29330ca2062623300f">
<link rel="stylesheet" href="/_blob/ec979927ac7a03464841432d3a3c8647">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700&amp;family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="{{themeClass}}">
<div class="sg">
  <div class="sg-side">
    <span class="sg-mark" aria-label="oryxa">oryxa<i>.</i></span>
    <form class="sg-form" aria-label="Reset your password">
      <span class="sg-sent"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/></svg></span>
      <h1>Reset your password</h1>
      <p class="sg-sub">We'll send you a link to choose a new one.</p>
      <div class="sg-field"><label>Email</label><div class="sg-input is-focus">ada@northstar.io<span class="sg-caret" style="margin-left: 0"></span></div></div>
      <button class="sg-submit" type="submit">Send reset link</button>
      <p class="sg-alt">Remembered it? <a href="#signin">Back to sign in</a></p>
    </form>
    <div class="sg-foot"><span class="sg-grow">© 2026 oryxa</span><a href="#privacy">Privacy</a><a href="#terms">Terms</a></div>
  </div>
  <div class="sg-scene" style="background-image: url('/_blob/d67e2e414662bc4d4545fa4b40fda90c')" role="img" aria-label="Painted scene">
    
    <div class="sg-line"><strong>Back on deck in a minute.</strong><span>The link works for 30 minutes.</span></div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, themeClass: (this.props.theme ?? 'dark') === 'light' ? 'light' : 'dark' };
  }
}
</script>
</body>
</html>
