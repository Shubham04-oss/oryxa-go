<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose a new password</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/f32f190865fef0a2e9f8e77cc5498886">
<link rel="stylesheet" href="/_blob/6f45e0000cdc5d3b68022ff8772ba543">
<link rel="stylesheet" href="/_blob/8fcfc97a611eed1a77ab799e995e95b4">
<link rel="stylesheet" href="/_blob/7743306d36203a29330ca2062623300f">
<link rel="stylesheet" href="/_blob/ec979927ac7a03464841432d3a3c8647">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700&amp;family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="{{themeClass}}">
<div class="sg">
  <div class="sg-side">
    <span class="sg-mark" aria-label="oryxa">oryxa<i>.</i></span>
    <form class="sg-form" aria-label="Choose a new password">
      <span class="sg-sent"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
      <h1>Choose a new password</h1>
      <p class="sg-sub">You'll be signed out everywhere else once it's saved.</p>
      <div class="sg-field"><label>New password</label><div class="sg-input is-focus">•••••••••••••<span class="sg-caret" style="margin-left: 0"></span><span class="sg-eye"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></span></div>
        <div class="sg-meter" aria-label="Password strength: good"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div></div>
      <div class="sg-rules" aria-label="Password rules"><span class="ok"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>12 characters or more</span><span class="ok"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Upper and lowercase</span><span class="ok"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>A number</span><span class=""><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/></svg>A symbol</span></div>
      <button class="sg-submit" type="submit">Update password</button>
    </form>
    <div class="sg-foot"><span class="sg-grow">© 2026 oryxa</span><a href="#privacy">Privacy</a><a href="#terms">Terms</a></div>
  </div>
  <div class="sg-scene" style="background-image: url('/_blob/d67e2e414662bc4d4545fa4b40fda90c')" role="img" aria-label="Painted scene">
    
    <div class="sg-line"><strong>Back on deck in a minute.</strong><span>Then sign in with your new password.</span></div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, themeClass: (this.props.theme ?? 'dark') === 'light' ? 'light' : 'dark' };
  }
}
</script>
</body>
</html>
