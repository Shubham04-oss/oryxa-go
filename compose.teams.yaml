services:
  teams:
    build:
      context: .
      dockerfile: teams/Dockerfile
    image: oryxa-teams:dev
    restart: unless-stopped
    env_file:
      - teams/.env
    environment:
      # Inside the network, teams listens on 8080 and reaches its neighbours
      # by container name rather than through the host.
      TEAMS_ADDRESS: ":8080"
      AUTH_URL: http://auth:8080
      DATABASE_URL: postgres://oryxa:oryxa-dev-password@oryxa-go-postgres-1:5432/oryxa?sslmode=disable
      AWS_ENDPOINT_URL: http://oryxa-go-eventbridge-1:4566
    ports:
      - "${TEAMS_PORT:-8083}:8080"
    networks:
      - oryxa-go

networks:
  oryxa-go:
    external: true
    name: oryxa-go_default
