# The shared ../oapi-codegen.yaml, except that response wrappers are named
# <Operation>Result: Figma's description already names its responses
# <Operation>Response, which would leave the wrappers numbered.
generate:
  models: true
  client: true
output-options:
  response-type-suffix: Result
  # A name that collides across component sections takes the section as a
  # suffix, such as RuleSuiteResultParameter.
  resolve-type-name-collisions: true
  # ID, URL and HTML rather than Id, Url and Html.
  name-normalizer: ToCamelCaseWithInitialisms
  # Inline objects get named types, so request bodies can be built.
  generate-types-for-anonymous-schemas: true
compatibility:
  # WorkflowStateActive rather than Active. Without this, a constant is
  # prefixed only while its name collides, so a newer description could rename
  # constants callers already use.
  always-prefix-enum-values: true
