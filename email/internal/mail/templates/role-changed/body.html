{{define "content"}}
<h1 style="margin:0 0 16px;font-size:22px;line-height:30px;font-weight:600;">Your role in {{.OrganizationName}} changed</h1>
<p style="margin:0 0 16px;">An owner of {{.OrganizationName}} changed your role on Oryxa from <strong>{{.PreviousRole}}</strong> to <strong>{{.Role}}</strong>.</p>
<p style="margin:24px 0 0;font-size:13px;line-height:20px;color:#78716c;">If you weren't expecting this, contact an owner of {{.OrganizationName}}.</p>
{{end}}
