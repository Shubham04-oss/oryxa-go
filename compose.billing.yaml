services:
  billing:
    build:
      context: .
      dockerfile: billing/Dockerfile
    image: oryxa-billing:dev
    restart: unless-stopped
    env_file:
      - billing/.env
    environment:
      # Inside the network, billing listens on 8080 and reaches its neighbours
      # by container name rather than through the host.
      BILLING_ADDRESS: ":8080"
      AUTH_URL: http://auth:8080
      DATABASE_URL: postgres://oryxa:oryxa-dev-password@oryxa-go-postgres-1:5432/oryxa?sslmode=disable
      AWS_ENDPOINT_URL: http://oryxa-go-eventbridge-1:4566
      # The plan catalog is configuration: mount the file the environment names.
      BILLING_PLANS_FILE: /etc/oryxa/plans.json
    volumes:
      - ./billing/plans.example.json:/etc/oryxa/plans.json:ro
    ports:
      - "${BILLING_PORT:-8081}:8080"
    networks:
      - oryxa-go

networks:
  oryxa-go:
    external: true
    name: oryxa-go_default
