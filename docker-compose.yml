# Local dependencies for oryxa-go.
#
# Postgres holds service data (pgvector/pgvector:0.8.6-pg17, with vector,
# ltree and pg_trgm). LocalStack stands in for EventBridge, SQS and
# DynamoDB, and Moto for SES, so an event can be published, routed to a queue,
# turned into an email and logged without an AWS account.
#
# The services are deliberately not here: they are what you are editing, and
# `go run` on the host rebuilds faster than any image.
name: oryxa-go

services:
  postgres:
    # pgvector's Postgres 17 image, not alpine: it ships vector, and Debian
    # contrib provides ltree and pg_trgm. Pin the pgvector version; the
    # floating pg17 tag moves. A volume created on alpine 17 still works
    # after this switch; CREATE EXTENSION runs from service migrations.
    image: pgvector/pgvector:0.8.6-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oryxa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oryxa-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-oryxa}
    ports:
      # Other local stacks already hold 5432-5434, so this one sits further
      # along. Container-side stays 5432.
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-oryxa} -d ${POSTGRES_DB:-oryxa}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # EventBridge, locally.
  #
  # Pinned to 4.14.0 because it is the last LocalStack release that starts
  # without an account. From 2026.03.0 every image requires
  # LOCALSTACK_AUTH_TOKEN, and the free Hobby plan forbids commercial use, so
  # moving past this tag means a paid plan rather than a version bump.
  #
  # SQS runs alongside it because a rule needs somewhere to deliver: a queue
  # target is how a service on the host receives what was published. DynamoDB
  # holds what services keep about the events they handled, such as the email
  # service's delivery log.
  #
  # Point the AWS SDK here with AWS_ENDPOINT_URL=http://localhost:4566 and any
  # non-empty credentials; the region is whatever the client sends.
  #
  # Nothing survives a restart. Buses, rules, queues and tables live in memory,
  # so re-run the provisioner of each service that owns them; this file creates
  # none.
  eventbridge:
    image: localstack/localstack:4.14.0
    restart: unless-stopped
    environment:
      SERVICES: events,sqs,dynamodb
      # Start them at boot instead of on first request. Loaded lazily they
      # report "available" until something calls them, and the healthcheck
      # below would never pass.
      EAGER_SERVICE_LOADING: "1"
    ports:
      - "${EVENTBRIDGE_PORT:-4566}:4566"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import json, urllib.request; services = json.load(urllib.request.urlopen('http://localhost:4566/_localstack/health'))['services']; raise SystemExit(any(services[name] != 'running' for name in ('events', 'sqs', 'dynamodb')))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # SES, locally.
  #
  # Moto rather than the LocalStack above: LocalStack's free image answers the
  # SES v2 API with a 501, and the email service is written against v2. Moto
  # takes simple and raw sends, and like real SES it refuses a sender whose
  # identity was never created.
  #
  # It has no stored SES templates, which costs nothing: /email renders its own.
  # Nor can it publish SES events, and it never delivers anything that could
  # bounce, so the email provisioner skips that setup here and bounces and
  # complaints are simulated instead (see email/README.md).
  #
  # Send only SES here, with AWS_ENDPOINT_URL_SESV2=http://localhost:4567.
  # Everything it has sent is listed under ses.Message at
  # http://localhost:4567/moto-api/data.json. It also forgets it all on restart.
  ses:
    image: motoserver/moto:5.2.3
    restart: unless-stopped
    ports:
      - "${SES_PORT:-4567}:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/moto-api/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catch mail the local email service sends. Open the UI at
  # http://localhost:8025. SMTP is :1025; set EMAIL_SMTP_ADDR=localhost:1025.
  mailpit:
    image: axllent/mailpit:v1.27.4
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
