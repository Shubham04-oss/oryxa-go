# Releases main to production once CI has passed on it, in the repository's
# production environment, which only main may deploy to. It builds the image
# for Fargate, rolls ECS onto it, records the release on main and deploys
# web-next's Worker. Infrastructure changes stay a manual `tofu apply`; see
# deploy/README.md for this workflow's one-time setup.
#
# It runs on GitHub's machines, never on the self-hosted runners CI uses: those
# persist between jobs and run pull requests' code, so a job there could read
# this one's AWS credentials, Cloudflare token and deploy key (#461).

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Releases main's head on demand, such as a redeploy.
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  # deploy/production/github.tf, in the account the state bucket is named for.
  AWS_DEPLOY_ROLE: arn:aws:iam::226236025533:role/oryxa-production-github-deploy
  REPOSITORY: 226236025533.dkr.ecr.us-west-2.amazonaws.com/oryxa
  CLUSTER: oryxa-production
  SERVICE: oryxa
  # cloudflare_account_id in deploy/production/variables.tf.
  CLOUDFLARE_ACCOUNT_ID: f50cbb237cd6f0ab48cc3679f727d132

jobs:
  scope:
    name: Scope
    # CI started by a push to main, and passed; or a run started by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Whether anything a release ships changed
        id: scope
        env:
          BY_HAND: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          # A run started by hand always releases. Otherwise a release follows
          # only a change a release ships since the one main records. Known
          # documentation and the release record ship nothing; other Markdown
          # can be embedded in a binary or used by tests.
          recorded=$(jq -r .image_tag deploy/production/release.auto.tfvars.json)
          if [ "$BY_HAND" = true ] || ! git cat-file -e "$recorded^{commit}" 2>/dev/null; then
            echo deploy=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Keep these exclusions aligned with CI's Changes step.
          docs='^docs/|^\.claude/|^README\.md$|^[^/]+/README\.md$'
          docs+='|^(agents/primary|contracts/http|deploy/runner|test/cmd/chaos)/README\.md$'
          docs+='|^web-next/src/lib/(agents|apps|threads)/README\.md$'
          docs+='|^(tasks|notion-api-research-2026-03-11)\.md$|^knowledge/TODO\.md$|^web-next/(AGENTS|DESIGN|REALTIME|PARITY)\.md$'
          shipped=$(git diff --name-only "$recorded" HEAD |
            grep -v -E "$docs|^deploy/production/release\.auto\.tfvars\.json$" || true)
          if [ -n "$shipped" ]; then echo deploy=true; else echo deploy=false; fi >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  production:
    name: Production
    needs: scope
    if: needs.scope.outputs.deploy == 'true'
    # Arm, like the Fargate tasks, so the image builds natively.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment: production
    permissions:
      # The release is recorded on main with RELEASE_DEPLOY_KEY, not this token.
      contents: read
      id-token: write # assumes the deploy role through GitHub's OIDC
    steps:
      - name: Setup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Nothing ships half-configured: the Worker needs it.
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::the production environment needs the CLOUDFLARE_API_TOKEN secret; see deploy/README.md"
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The commit CI passed, not whatever main holds by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Release tag
        id: release
        # The tag deploy/scripts/release.sh would give the same commit.
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push the image
        timeout-minutes: 25
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REPOSITORY%%/*}"
          docker buildx build --platform linux/arm64 --build-arg VERSION="$TAG" --tag "$REPOSITORY:$TAG" --push .

      - name: Roll the service onto it
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # The running task definition with only oryxa's image changed, so
          # everything OpenTofu set on it carries over.
          current=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "$current" --include TAGS > current.json
          jq --arg image "$REPOSITORY:$TAG" '
            (.taskDefinition
              | .containerDefinitions |= map(if .name == "oryxa" then .image = $image else . end)
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                    .registeredAt, .registeredBy, .deregisteredAt))
            + (if ((.tags // []) | length) > 0 then {tags: .tags} else {} end)
          ' current.json > next.json
          next=$(aws ecs register-task-definition --cli-input-json file://next.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "rolling $SERVICE from $current to $next"
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$next" > /dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          # The circuit breaker rolls a release that never turns healthy back,
          # and a service rolled back is stable too: check what it settled on.
          # ECS can call the service stable before it gives the rollout its
          # verdict, so wait up to ten minutes for one.
          for _ in $(seq 60); do
            read -r running rollout < <(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
              --query 'services[0].deployments[?status==`PRIMARY`] | [0].[taskDefinition, rolloutState]' --output text)
            [ "$rollout" != "IN_PROGRESS" ] && break
            sleep 10
          done
          if [ "$running" != "$next" ] || [ "$rollout" != "COMPLETED" ]; then
            echo "::error::the service settled on $running ($rollout), not $next"
            exit 1
          fi

      - name: Record the release on main
        # What release.sh has a person commit: without it, the next
        # `tofu apply` would roll the service back to the tag it holds.
        # main's ruleset requires CI, and only this deploy key may bypass
        # it; a push with the workflow's own token would be refused.
        # [skip ci]: the record ships nothing (the scope job agrees).
        env:
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "$RELEASE_DEPLOY_KEY" ]; then
            echo "::error::the production environment needs the RELEASE_DEPLOY_KEY secret; see deploy/README.md"
            exit 1
          fi
          path=deploy/production/release.auto.tfvars.json
          key=$(mktemp)
          # A clone of its own: the checkout above is the commit CI passed,
          # which the Worker deploy below still needs as it is.
          record=$(mktemp -d)
          trap 'rm -rf "$key" "$record"' EXIT
          printf '%s\n' "$RELEASE_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --quiet --depth 1 --branch main "git@github.com:$GITHUB_REPOSITORY.git" "$record"
          cd "$record"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # main may move under us; rebuild the record on its newest commit.
          for attempt in 1 2 3; do
            git fetch --quiet --depth 1 origin main
            git checkout --quiet --detach FETCH_HEAD
            if [ "$(jq -r .image_tag "$path")" = "$TAG" ]; then
              echo "$TAG is already recorded"
              exit 0
            fi
            count=$(jq '.desired_count // 1' "$path")
            jq -n --arg tag "$TAG" --argjson count "$count" \
              '{image_tag: $tag, desired_count: $count}' > "$path"
            git commit --quiet -m "deploy: record release $TAG [skip ci]" -- "$path"
            if git push --quiet origin HEAD:main; then exit 0; fi
            sleep 5
          done
          echo "::error::could not record $TAG on main"
          exit 1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26

      - name: Deploy the web Worker
        # web-next's env.production, the Worker app.oryxa.in routes to. The
        # build writes the configuration wrangler deploys, as web.sh relies on.
        working-directory: web-next
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          npm install --global pnpm@12.4.2
          pnpm install --frozen-lockfile
          CLOUDFLARE_ENV=production pnpm build
          pnpm exec wrangler deploy
