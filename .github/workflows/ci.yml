# Every pull request, and every push to main, builds and tests what a release
# would ship: the Go services (with their PostgreSQL integration tests), the
# web app as the production Worker, and the image the Dockerfile makes. A job
# runs only when the change touches what it checks (the changes job), so a
# docs-only change runs nothing.
#
# Jobs run on the self-hosted runners on a1 (labels self-hosted, oryxa-go).
# Those machines persist between jobs, so nothing here may assume a fresh
# host: the database takes a free host port, and the image built is removed.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: [self-hosted, oryxa-go]
    timeout-minutes: 5
    outputs:
      go: ${{ steps.paths.outputs.go }}
      web: ${{ steps.paths.outputs.web }}
      web_next: ${{ steps.paths.outputs.web_next }}
      edge: ${{ steps.paths.outputs.edge }}
      tofu: ${{ steps.paths.outputs.tofu }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: What the change touches
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # The files this change touches: a pull request's against the base
          # it merges into, a push's against the commit before it. Anything
          # unknown, or the workflow itself, checks everything.
          all=false
          files=
          if [ "$EVENT" = pull_request ] && git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            # GitHub checks a pull request out as its merge into the base's
            # current tip, the merge's first parent. The event's base can be
            # older, and diffing against it would count what landed on the
            # base since then as this change.
            files=$(git diff --name-only 'HEAD^1' HEAD)
          elif [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            all=true
          else
            files=$(git diff --name-only "$(git merge-base "$BASE" HEAD)" HEAD)
          fi
          grep -q '^\.github/' <<<"$files" && all=true
          if [ "$all" = true ]; then
            printf 'go=true\nweb=true\nweb_next=true\nedge=true\ntofu=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only known documentation paths skip builds. Other Markdown can
          # be embedded in Go binaries or loaded by tests.
          # Keep these exclusions aligned with Deploy's Scope step.
          docs='^docs/|^\.claude/|^README\.md$|^[^/]+/README\.md$'
          docs+='|^(agents/primary|contracts/http|deploy/runner|test/cmd/chaos)/README\.md$'
          docs+='|^web-next/src/lib/(agents|apps|threads)/README\.md$'
          docs+='|^(tasks|notion-api-research-2026-03-11)\.md$|^knowledge/TODO\.md$|^web-next/(AGENTS|DESIGN|REALTIME|PARITY)\.md$'
          code=$(grep -v -E "$docs" <<<"$files" || true)
          # Go covers everything outside the web apps and deployment:
          # services, contracts, infra, tests and the Dockerfile.
          has() { grep -q -E "$1" <<<"$code" && echo true || echo false; }
          {
            echo "go=$(grep -v -E '^(web/|web-next/|edge/|deploy/)' <<<"$code" | grep -q . && echo true || echo false)"
            echo "web=$(has '^web/')"
            echo "web_next=$(has '^web-next/')"
            # The edge also checks the contract fixtures it shares with Go.
            echo "edge=$(has '^(edge/|contracts/edge/)')"
            echo "tofu=$(has '^deploy/production/')"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  go:
    name: Go
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: [self-hosted, oryxa-go]
    timeout-minutes: 20
    services:
      # The same pgvector image docker-compose.yml runs locally.
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: oryxa
          POSTGRES_PASSWORD: oryxa
          POSTGRES_DB: oryxa
        # A free host port: two runners on one machine, and a1's own
        # database, would clash on a fixed one.
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U oryxa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # Each runner's user keeps its own Go caches between jobs.
          cache: false
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Every event publisher has a signing key
        # A service that signs its events without a KMS key (keys.tf) signs
        # with one that dies at each restart, and once
        # ORYXA_EVENT_SIGNATURES=enforce its events in flight across a deploy
        # are refused. So every service calling EventAuth.Signer must be named
        # in event_signing_keys.
        run: |
          keys=$(awk '/event_signing_services =/,/^  \)$/' deploy/production/keys.tf)
          missing=0
          for file in $(grep -rl --include='*.go' 'EventAuth.Signer(Name)' . | grep -v '_test\.go$'); do
            name=$(grep -ho 'const Name = "[a-z-]*"' "$(dirname "$file")"/*.go | head -1 | cut -d'"' -f2)
            if [ -z "$name" ] || ! printf '%s\n' "$keys" | grep -Eq "\"$name\"|^ +$name +="; then
              echo "::error file=$file::${name:-this service} signs events but has no key in deploy/production/keys.tf event_signing_keys"
              missing=1
            fi
          done
          exit "$missing"
      - name: Database
        env:
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
        # Each service's integration tests run when their database is named,
        # and skip otherwise; here they share one, as they do on a laptop,
        # with the extensions infra/postgres/init gives a fresh local volume.
        run: |
          for service in ACCESS AGENTS_PRIMARY APPS AUTH BATCHING BILLING FILES INTEGRATIONS KNOWLEDGE OUTBOX POSTGRESKIT RAG REALTIME SLACK TEAMS WORKSPACE; do
            echo "${service}_TEST_DATABASE_URL=postgres://oryxa:oryxa@localhost:$PGPORT/oryxa?sslmode=disable" >> "$GITHUB_ENV"
          done
          docker exec -i "${{ job.services.postgres.id }}" psql -U oryxa -d oryxa -v ON_ERROR_STOP=1 < infra/postgres/init/001_extensions.sql
          # The schemas several test packages create at once. go test runs
          # packages in parallel against this one database, and CREATE SCHEMA
          # IF NOT EXISTS is not safe against itself: two transactions that
          # both find it missing collide on pg_namespace (SQLSTATE 23505).
          # A laptop's database, like production's, already has them.
          docker exec -i "${{ job.services.postgres.id }}" psql -U oryxa -d oryxa -v ON_ERROR_STOP=1 \
            -c 'CREATE SCHEMA IF NOT EXISTS agents_primary' -c 'CREATE SCHEMA IF NOT EXISTS workspace'
      - name: Auth's schema
        # agents' session tests read auth's tables, which a laptop's database
        # already has; auth's own tests migrate them into this fresh one.
        run: go test -count=1 ./auth/internal/postgres/
      - name: Integrations' schema
        # The service migrates only when switched on, so its internal
        # packages' tests rely on the root package's test to install the
        # schema; run it first rather than racing them in the Test step.
        run: go test -count=1 -run TestVaultTables ./integrations/
      - name: Test
        id: test
        # The JSON events are kept for the step below. What prints is what
        # plain `go test` would: each package's result as it finishes, then
        # the output of every test that failed.
        run: |
          set -o pipefail
          status=0
          go test -count=1 -json ./... | tee "$RUNNER_TEMP/go-test.json" |
            jq -rj --unbuffered 'select(.Test == null and .Output != null and (.Output | test("^(PASS|FAIL)\\n$") | not)) | .Output' || status=$?
          if [ "$status" -ne 0 ]; then
            # A test that never finished (a timeout's panic and goroutine dump
            # land on it) has no pass, fail or skip, so it counts as failed.
            jq -rjs '[.[] | select(.Test != null and (.Action == "pass" or .Action == "skip")) | [.Package, .Test]] as $passed
              | .[] | select(.Test != null and .Output != null and ([.Package, .Test] | IN($passed[]) | not)) | .Output' \
              "$RUNNER_TEMP/go-test.json"
          fi
          exit "$status"
      - name: Database suites ran
        # Every *_TEST_DATABASE_URL is set above, so a test that skips naming
        # one means a suite read a variable this job does not set, and has
        # been passing without running. Fail rather than let it go quiet.
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: |
          skipped=$(jq -rs '
            [.[] | select(.Test != null and .Action == "output" and (.Output | test("[A-Z_]+_TEST_DATABASE_URL"))) | [.Package, .Test]] as $named
            | [.[] | select(.Test != null and .Action == "skip") | [.Package, .Test]] | unique
            | map(select(IN($named[]))) | .[] | "\(.[0]) \(.[1])"' "$RUNNER_TEMP/go-test.json")
          if [ -n "$skipped" ]; then
            echo "::error::These database tests skipped for want of a *_TEST_DATABASE_URL; set it in the Database step:"
            echo "$skipped"
            exit 1
          fi
          echo "No database test skipped for want of its database."

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: [self-hosted, oryxa-go]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26
      - name: pnpm
        # The version deploy/scripts/web.sh deploys with.
        run: npm install --global pnpm@12.4.2
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm check
      - name: Types
        run: pnpm typecheck
      - name: Tests
        # The Mac's runners share their CPU and memory with each other, and
        # the second is capped at 4 GB. Vitest's default, a worker per core,
        # thrashes there, and unrelated tests timed out at the 5 s default on
        # a busy machine. Four workers and 20 s give them room.
        run: pnpm test --maxWorkers=4 --testTimeout=20000
      - name: Build the production Worker
        run: pnpm build
        env:
          CLOUDFLARE_ENV: production
      - name: Wrangler dry run
        # Validates the built Worker's configuration and bindings, including
        # the Durable Object and its migration, without uploading anything.
        run: pnpm exec wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: "false"

  web-next:
    name: Web next
    needs: changes
    if: needs.changes.outputs.web_next == 'true'
    runs-on: [self-hosted, oryxa-go]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-next
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26
      - name: pnpm
        run: npm install --global pnpm@12.4.2
      - run: pnpm install --frozen-lockfile
      - name: Prettier
        run: pnpm check
      - name: ESLint
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Tests
        # The Mac's runners share their CPU and memory with each other, and
        # the second is capped at 4 GB. Vitest's default, a worker per core,
        # thrashes there, and unrelated tests timed out at the 5 s default on
        # a busy machine. Four workers and 20 s give them room.
        run: pnpm test --maxWorkers=4 --testTimeout=20000
      - name: Build the production Worker
        # The build deploy.yml ships, so the size below is the one that is
        # uploaded.
        run: pnpm build
        env:
          CLOUDFLARE_ENV: production
      - name: Worker size
        # What `wrangler deploy` would upload, without uploading anything. A
        # Worker has a size limit and starts slower the more code it holds,
        # and a library only the browser needs can ride along in it unnoticed
        # (the document viewer's PDF, Word, Excel and PowerPoint renderers
        # did), so the size is printed on every run, with the biggest files
        # behind it.
        run: |
          set -o pipefail
          pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker" 2>&1 | tee "$RUNNER_TEMP/worker-dry-run.txt"
          size=$(grep -m1 'Total Upload' "$RUNNER_TEMP/worker-dry-run.txt" || true)
          if [ -z "$size" ]; then
            echo "::warning::wrangler printed no 'Total Upload' line"
            size="(no size reported)"
          fi
          {
            echo "### web-next Worker"
            echo
            echo "\`$size\`"
            echo
            echo "Biggest files in the upload (bytes):"
            echo
            echo '```'
            find "$RUNNER_TEMP/worker" -type f ! -name '*.map' -exec wc -c {} + | sort -rn | sed -n '1,12p'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          WRANGLER_SEND_METRICS: "false"

  edge:
    name: Edge
    needs: changes
    if: needs.changes.outputs.edge == 'true'
    runs-on: [self-hosted, oryxa-go]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26
      - name: pnpm
        run: npm install --global pnpm@12.4.2
      - run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm typecheck
      - name: Tests
        # The contract project reads the fixtures Go's tests read; the
        # workers project runs the Durable Objects in workerd.
        run: pnpm test --maxWorkers=4 --testTimeout=20000
      - name: Wrangler dry run
        # Validates the bindings, Durable Objects, migrations and container
        # config without uploading anything. The sandbox image is linux/amd64
        # and these runners are arm64, so it is built where it deploys.
        run: pnpm exec wrangler deploy --dry-run --containers-rollout=none
        env:
          WRANGLER_SEND_METRICS: "false"

  image:
    name: Image
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: [self-hosted, oryxa-go]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build
        run: docker build --tag "oryxa:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" .
      - name: Remove the image
        if: always()
        run: docker image rm -f "oryxa:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" || true

  tofu:
    name: OpenTofu
    needs: changes
    if: needs.changes.outputs.tofu == 'true'
    runs-on: [self-hosted, oryxa-go]
    # The providers are several hundred megabytes. From a cold cache on a
    # self-hosted runner they have taken over ten minutes to download.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          # We only need the CLI's exit status; the Node wrapper needs a Node
          # executable on PATH, which the self-hosted runner does not provide.
          tofu_wrapper: false
      - name: Validate deploy/production
        # Without the S3 backend: this checks the configuration, not the state.
        # A self-hosted runner's tool cache outlives the job, so the providers
        # download once per runner; on GitHub's machines it starts empty.
        run: |
          export TF_PLUGIN_CACHE_DIR="$RUNNER_TOOL_CACHE/opentofu-plugins"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          tofu -chdir=deploy/production init -backend=false -input=false
          tofu -chdir=deploy/production validate
