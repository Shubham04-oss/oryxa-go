# The integrations loop agent (docs/design/integrations/loop-agent.md):
# once a day it builds one queued piece of the integrations service. It never
# merges; macbookpro reviews and merges.
#
# The agent holds no write credentials. It runs with the workflow's read-only
# token, and what it wants published (a loop/* branch, a pull request,
# comments, labels, follow-up issues) it writes to .loop/outbox.json. Its job
# hands over only data, a git bundle of that branch and the outbox, as an
# artifact. A second job on a fresh GitHub-hosted machine, with a pristine
# checkout of main, checks them and publishes with LOOP_GH_TOKEN
# (.github/scripts/loop-publish.sh). The agent never shares a machine or a
# process with that token, so nothing it runs or leaves behind can merge,
# push to main, force-push or change workflows. LOOP_GH_TOKEN must not have
# the Workflows permission, and the script refuses any change under .github/.
#
# It runs on a1's dedicated runner (label oryxa-loop), so CI keeps both of
# a1's oryxa-go runners. That runner is persistent, so no secret but the
# agent's own Claude token ever reaches it: oryxa-platform is fetched by a
# separate GitHub-hosted job and handed over as an artifact. Secrets:
#   CLAUDE_CODE_OAUTH_TOKEN  `claude setup-token`, the owner's subscription
#   LOOP_GH_TOKEN            fine-grained: this repo (contents, pull requests,
#                            issues: write) and oryxa-platform (contents:
#                            read). A pull request opened with the workflow's
#                            own GITHUB_TOKEN would not start CI.
name: Integrations loop

on:
  schedule:
    # 20:30 UTC, 02:00 in India: while the other agents are quiet.
    - cron: "30 20 * * *"
  workflow_dispatch: {}

concurrency:
  group: integrations-loop
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  fetch:
    name: Fetch oryxa-platform
    # On a fresh GitHub-hosted machine, so LOOP_GH_TOKEN never reaches the
    # agent's persistent runner; the agent gets the files as an artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone
        env:
          TOKEN: ${{ secrets.LOOP_GH_TOKEN }}
        run: |
          git clone --depth 1 --quiet "https://x-access-token:${TOKEN}@github.com/Shubham04-oss/oryxa-platform.git" oryxa-platform
          rm -rf oryxa-platform/.git oryxa-platform/target oryxa-platform/node_modules oryxa-platform/connectors/node_modules
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oryxa-platform
          path: oryxa-platform
          retention-days: 1

  build:
    needs: fetch
    name: Build one piece
    runs-on: [self-hosted, oryxa-loop]
    timeout-minutes: 150
    services:
      # As CI's Go job: tests that need a database get one.
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: oryxa
          POSTGRES_PASSWORD: oryxa
          POSTGRES_DB: oryxa
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U oryxa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          # The agent's shell must not find a token in .git/config.
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Database
        env:
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          for service in AGENTS_PRIMARY APPS AUTH INTEGRATIONS OUTBOX POSTGRESKIT; do
            echo "${service}_TEST_DATABASE_URL=postgres://oryxa:oryxa@localhost:$PGPORT/oryxa?sslmode=disable" >> "$GITHUB_ENV"
          done
          docker exec -i "${{ job.services.postgres.id }}" psql -U oryxa -d oryxa -v ON_ERROR_STOP=1 < infra/postgres/init/001_extensions.sql
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oryxa-platform
          path: ${{ runner.temp }}/oryxa-platform
      - name: oryxa-platform, to read
        run: echo "ORYXA_PLATFORM_DIR=$RUNNER_TEMP/oryxa-platform" >> "$GITHUB_ENV"
      - name: Git identity
        run: |
          git config user.name "integrations-loop"
          git config user.email "integrations-loop@users.noreply.github.com"
          rm -rf .loop
      - uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7 # v1.0.237
        env:
          # Read-only: issues, pull requests and CI status, nothing more.
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            You are the integrations loop agent for this repository.
            Read docs/design/integrations/loop-agent.md and follow it exactly for today's run.
            The design is docs/design/integrations/README.md. oryxa-platform is checked out at $ORYXA_PLATFORM_DIR.
            Today is a new run: start at step 1.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 300
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,TodoWrite"
      - name: Package
        # Data only, no secrets in this step: the branch the outbox names, as
        # a bundle, and the outbox itself.
        run: |
          out="$RUNNER_TEMP/loop-out"
          rm -rf "$out" && mkdir -p "$out"
          if [ -f .loop/outbox.json ]; then
            cp .loop/outbox.json "$out/outbox.json"
            branch=$(jq -r '.branch // empty' .loop/outbox.json)
            if [[ "$branch" =~ ^loop/[0-9]+-[a-z0-9-]{1,60}$ ]]; then
              git -c core.hooksPath=/dev/null -c core.fsmonitor=false bundle create "$out/branch.bundle" "refs/heads/$branch"
            fi
          fi
          echo "dir=$out" >> "$GITHUB_OUTPUT"
        id: package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loop-out
          path: ${{ steps.package.outputs.dir }}
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish
    needs: build
    # A fresh machine the agent never touched.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: loop-out
          path: ${{ runner.temp }}/loop-out
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.LOOP_GH_TOKEN }}
          LOOP_IN: ${{ runner.temp }}/loop-out
        run: .github/scripts/loop-publish.sh
